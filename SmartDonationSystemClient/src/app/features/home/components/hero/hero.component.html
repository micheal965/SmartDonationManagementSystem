<main
    class="relative min-h-screen pt-32 pb-20 bg-gradient-to-l from-white via-transparent to-light-green/15 shadow-light-green/15 overflow-hidden">
    <div class="max-w-7xl mx-auto px-6">
        <div class="grid lg:grid-cols-2 gap-12 items-center">
            <!-- Left Content -->
            <div class="space-y-8 relative z-10">
                <div
                    class="inline-flex items-center gap-2 px-4 py-2 bg-light-green border border-light-green bg-light-green/10 rounded-full">
                    <span class="w-2 h-2 rounded-full bg-light-green"></span>
                    <span class="text-xs font-bold uppercase tracking-widest text-light-green">v1.0 Demo</span>
                </div>
                <h1 class="text-5xl lg:text-7xl font-800 text-dark-blue">
                    Smart Philanthropy <br />
                    <span class="text-light-green">Powered by Transparency</span>
                </h1>
                <p class="text-lg md:text-xl text-dark-blue max-w-xl">
                    Redefine the way you give. Our smart tracking system ensures every cent reaches its destination with
                    real-time impact monitoring and immutable records.
                </p>
                <div class="flex flex-col sm:flex-row items-center gap-4 pt-4">
                    <button
                        class="group w-full sm:w-auto px-8 py-4 bg-light-green text-white text-lg font-bold rounded-3xl shadow-xl shadow-light-green/20 hover:brightness-105 transition-all flex items-center justify-center gap-2 group">
                        Start Donating
                        <svg class="w-6 h-6 group-hover:translate-x-1 duration-300" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                    <button
                        class="w-full sm:w-auto px-8 py-4 bg-transparent border-2 border-bright-blue/20 text-lg font-bold rounded-3xl hover:bg-bright-blue/5 transition-all flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="24" cy="24" r="22" stroke="var(--bright-blue)" stroke-width="2"
                                stroke-opacity="0.3" />

                            <path d="M31.5 24L19.5 31L19.5 17L31.5 24Z" fill="var(--bright-blue)" />

                            <circle cx="24" cy="24" r="18" stroke="var(--bright-blue)" stroke-width="1" />
                        </svg>
                        Watch Video
                    </button>
                </div>
            </div>
            <!-- Right Visual (Dashboard Mockup) -->
            <div class="relative lg:ml-12">
                <!-- Background blobs for depth -->
                <div class="absolute -top-20 -right-20 w-80 h-80 bg-light-green/10 rounded-full blur-[100px]"></div>
                <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-bright-blue/10 rounded-full blur-[80px]"></div>
                <!-- Main Dashboard Container -->
                <div class="relative bg-white p-4 rounded-2xl border border-slate-200  shadow-2xl backdrop-blur-sm">
                    <div class="bg-slate-50 rounded-xl overflow-hidden aspect-[4/3] flex flex-col">
                        <!-- Dashboard Header UI -->
                        <div class="p-4 border-b border-slate-200 flex justify-between items-center">
                            <div class="flex gap-1.5">
                                <div class="w-2.5 h-2.5 rounded-full bg-red-400"></div>
                                <div class="w-2.5 h-2.5 rounded-full bg-yellow-400"></div>
                                <div class="w-2.5 h-2.5 rounded-full bg-green-400"></div>
                            </div>
                        </div>
                        <!-- Dashboard Content UI -->
                        <div class="flex-1 p-6 grid grid-cols-6 gap-4">
                            <!-- Sidebar Mock -->
                            <div class="col-span-1 space-y-4">
                                <div class="w-full h-8 bg-light-green/20 rounded-md"></div>
                                <div class="w-8 h-8 bg-slate-200  rounded-md"></div>
                                <div class="w-8 h-8 bg-slate-200  rounded-md"></div>
                                <div class="w-8 h-8 bg-slate-200  rounded-md"></div>
                            </div>
                            <!-- Main Panel Mock -->
                            <div class="col-span-5 space-y-6">
                                <div class="flex justify-between">
                                    <div class="space-y-2">
                                        <div class="w-32 h-4 bg-slate-200  rounded"></div>
                                        <div class="w-48 h-8 bg-slate-300  rounded"></div>
                                    </div>
                                    <div class="w-12 h-12 bg-light-green rounded-full"></div>
                                </div>
                                <!-- Chart Placeholder -->
                                <div
                                    class="w-full h-40 bg-gradient-to-t from-light-green/20 to-transparent border border-light-green/20 rounded-xl flex items-end p-4 gap-2">
                                    <div class="flex-1 bg-light-green/30 h-1/4 rounded-t"></div>
                                    <div class="flex-1 bg-light-green/40 h-2/4 rounded-t"></div>
                                    <div class="flex-1 bg-light-green/50 h-3/4 rounded-t"></div>
                                    <div class="flex-1 bg-light-green/40 h-1/2 rounded-t"></div>
                                    <div class="flex-1 bg-light-green h-full rounded-t"></div>
                                    <div class="flex-1 bg-light-green/60 h-2/3 rounded-t"></div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="h-20 bg-white rounded-lg border border-slate-100 p-3">
                                        <div class="w-12 h-2 bg-slate-200  rounded mb-2"></div>
                                        <div class="w-16 h-4 bg-slate-300 dark:bg-slate-600 rounded"></div>
                                    </div>
                                    <div class="h-20 bg-white rounded-lg border border-slate-100 p-3">
                                        <div class="w-12 h-2 bg-slate-200 rounded mb-2"></div>
                                        <div class="w-16 h-4 bg-slate-300 rounded"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Floating Stat Card 1 -->
                    <div
                        class="absolute -bottom-6 -left-10 bg-white p-5 rounded-2xl shadow-xl border border-slate-100 hidden sm:block">
                        <div class="flex justify-center items-center gap-4">
                            <div
                                class="w-12 h-12 rounded-full bg-light-green/20 flex items-center justify-center text-emerald-500">
                                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M10.5213 2.62368C11.3147 1.75253 12.6853 1.75253 13.4787 2.62368L14.4989 3.74391C14.8998 4.18398 15.4761 4.42283 16.0776 4.39808L17.6106 4.33501C18.8021 4.28598 19.714 5.19793 19.665 6.38939L19.6019 7.92243C19.5772 8.52387 19.816 9.10023 20.2561 9.5011L21.3763 10.5213C22.2475 11.3147 22.2475 12.6853 21.3763 13.4787L20.2561 14.4989C19.816 14.8998 19.5772 15.4761 19.6019 16.0776L19.665 17.6106C19.714 18.8021 18.8021 19.714 17.6106 19.665L16.0776 19.6019C15.4761 19.5772 14.8998 19.816 14.4989 20.2561L13.4787 21.3763C12.6853 22.2475 11.3147 22.2475 10.5213 21.3763L9.5011 20.2561C9.10023 19.816 8.52387 19.5772 7.92243 19.6019L6.38939 19.665C5.19793 19.714 4.28598 18.8021 4.33501 17.6106L4.39808 16.0776C4.42283 15.4761 4.18398 14.8998 3.74391 14.4989L2.62368 13.4787C1.75253 12.6853 1.75253 11.3147 2.62368 10.5213L3.74391 9.5011C4.18398 9.10023 4.42283 8.52387 4.39808 7.92243L4.33501 6.38939C4.28598 5.19793 5.19793 4.28598 6.38939 4.33501L7.92243 4.39808C8.52387 4.42283 9.10023 4.18398 9.5011 3.74391L10.5213 2.62368Z"
                                        fill="#42e2b8" />
                                    <path d="M9 12L11 14L15 10" stroke="white" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>

                            </div>
                            <div>
                                <p class="text-xs font-bold text-slate-400 uppercase">Total Verified</p>
                                <p class="text-xl font-800 text-slate-800 ">EGP 100+</p>
                            </div>
                        </div>
                    </div>
                    <!-- Floating Stat Card 2 -->
                    <div
                        class="absolute top-1/2 -right-12 -translate-y-1/2 bg-white p-4 rounded-2xl shadow-xl border border-slate-100 hidden md:block">
                        <div class="space-y-3">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Live Updates</p>
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center">
                                    <svg class="w-6 h-6 text-bright-blue" fill="none" fill="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 116.364 6.364L12 21.682 4.318 12.682a4.5 4.5 0 010-6.364z" />
                                    </svg>
                                </div>
                                <div class="w-24 h-2 bg-slate-100  rounded-full overflow-hidden">
                                    <div class="w-2/3 h-full bg-bright-blue"></div>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-light-green/20 flex items-center justify-center">
                                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="#FFD700" fill="#42e2b8"
                                            stroke-width="2" stroke-linejoin="round" />
                                    </svg>
                                </div>
                                <div class="w-24 h-2 bg-slate-100  rounded-full overflow-hidden">
                                    <div class="w-4/5 h-full bg-light-green"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
