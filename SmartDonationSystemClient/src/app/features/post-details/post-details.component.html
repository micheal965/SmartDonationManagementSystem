<article
    class="max-w-7xl mx-2 md:mx-auto px-4 py-6 md:py-0 my-6 md:my-8 lg:my-10 bg-white rounded-2xl shadow-sm  overflow-hidden">
    <div class="p-4 sm:p-6 md:p-10 lg:p-14">

        <!-- Author Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6 mb-8">

            <div class="flex items-center gap-4">
                <img alt="Post author" class="w-12 h-12 sm:w-14 sm:h-14 rounded-full object-cover"
                    [src]="post.pictureUrl || './assets/avatar.png'" />

                <div>
                    <div class="flex items-center gap-2 flex-wrap">
                        <h3 class="font-bold text-base sm:text-lg text-dark-blue ">
                            {{post.fullName}}
                        </h3>

                        <mat-icon matTooltip="Verified Organizer" class="text-light-green text-base">
                            verified
                        </mat-icon>
                    </div>

                    <p class="text-slate-500 text-xs sm:text-sm">
                        <span class="text-dark-blue font-medium text-md">{{post.phoneNumber}}</span>
                        • {{post.createdAt | timeAgo}}
                    </p>
                </div>
            </div>

            <!-- Priority Badge -->
            <div class="px-3 py-2 sm:px-4 sm:py-2 rounded-xl flex items-center justify-center gap-2 text-xs sm:text-sm"
                [ngClass]="post.priorityLevel | priorityClass">

                <span class="relative flex h-2 w-2">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-white"></span>
                </span>

                <span class="font-bold uppercase tracking-wide">
                    {{post.priorityLevel | priorityLabel}} Priority
                </span>
            </div>
        </div>

        <!-- Post Title -->
        <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl 
      font-black text-dark-blue dark:text-slate-100 
      mb-6 sm:mb-8 leading-tight">
            {{post.title}}
        </h1>

        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row flex-wrap items-stretch sm:items-center gap-3 
      mb-8 pb-8 border-b border-slate-100 dark:border-slate-800">

            <button *ngIf="post.categoryName==='Medical'" class="flex-1 flex items-center justify-center gap-2 
        bg-light-green font-bold text-dark-blue text-sm 
        py-3 rounded-xl shadow-lg shadow-light-green/30 
        hover:shadow-light-green/40 active:scale-95 transition-all">

                <mat-icon>favorite</mat-icon>
                Donate Now
            </button>

            <button class="h-12 sm:h-14 px-6 bg-slate-50 text-dark-blue 
       font-bold rounded-xl 
        hover:bg-slate-100 transition-colors 
        flex items-center justify-center gap-2">

                <mat-icon>message</mat-icon>
                Message
            </button>
        </div>

        <!-- Main Layout -->
        <div class="grid grid-cols-1">

            <div class="col-span-full">
                <!-- Content -->
                <div class="max-w-none">
                    <p class="text-base sm:text-lg leading-relaxed text-slate-600 mb-6">
                        {{post.content}}
                    </p>
                </div>

                <!-- Comments -->
                <section class="mt-12 sm:mt-16">

                    <div class="flex items-center justify-between mb-6 sm:mb-8 flex-wrap gap-3">
                        <h3 class="text-xl sm:text-2xl font-bold text-dark-blue">
                            Community Thoughts ({{comments.length}})
                        </h3>

                        <button *ngIf="comments.length > 4" class="text-sm font-bold text-light-green hover:underline"
                            (click)="toggleShowAll()">
                            {{ showAllComments ? 'View less' : 'View all' }}
                        </button>
                    </div>

                    <!-- Comment Input -->
                    <div
                        class="relative flex flex-col items-start md:flex-row md:items-center gap-3 sm:gap-4 mb-8 sm:mb-10 w-full md:w-11/12 mx-auto">

                        <img alt="Current user" class="w-11 h-11 rounded-full object-cover"
                            [src]="userService.profile()?.pictureUrl || './assets/avatar.png'" />

                        <!-- textarea container -->
                        <div class="flex justify-center items-center w-full relative bg-slate-50 border border-slate-200
                                     focus-within:ring-2 focus-within:ring-light-green transition p-2 rounded-2xl">

                            <textarea [(ngModel)]="newComment.Content" (input)="autoResize($event)" rows="1"
                                placeholder="Share your comment..." class="w-full resize-none outline-none bg-transparent
                            placeholder:text-slate-400 text-sm text-slate-700
                            max-h-24 overflow-y-auto">
                            </textarea>

                            <button (click)="sendComment()" [disabled]="!newComment.Content.trim()"
                                class="flex justify-center items-center text-light-green hover:text-green-600 disabled:opacity-50 transition">
                                <mat-icon class="ms-2">send</mat-icon>
                            </button>

                        </div>

                    </div>
                    <!-- Comments List -->
                    <div class="space-y-6 sm:space-y-8">
                        <ng-container *ngFor="let comment of displayedComments">
                            <app-comment-item [comment]="comment" (replyAdded)="handleReply($event)" />
                        </ng-container>
                    </div>

                </section>
            </div>
        </div>
    </div>
</article>
