<article [routerLink]="['/posts', post.id]" class="bg-white rounded-2xl border shadow-sm p-6
   hover:shadow-xl hover:-translate-y-1
   transition-all duration-300 cursor-pointer
   flex flex-col min-h-[240px]">

    <!-- Title -->
    <h3 class="text-xl font-bold text-gray-800 mb-3 line-clamp-1">
        {{ post.title }}
    </h3>

    <!-- Content Preview -->
    <p class="text-gray-500 text-sm leading-relaxed line-clamp-3">
        {{ post.content }}
    </p>

    <!-- Spacer -->
    <div class="flex-grow"></div>

    <!-- Footer -->
    <div class="flex items-center justify-between mt-6 pt-4 border-t">

        <!-- Likes -->
        <div class="flex items-center  text-sm text-gray-500">
            <div class="w-8 h-8 flex items-center justify-center
                rounded-full  text-red-500 text-sm font-semibold">
                <mat-icon>favorite</mat-icon>
            </div>
            <span class="text-sm text-gray-400">
                {{ post.likesCount }}
            </span>
        </div>

        <!-- View -->
        <span class="text-indigo-600 text-sm font-medium hover:underline">
            View →
        </span>

    </div>

</article>
