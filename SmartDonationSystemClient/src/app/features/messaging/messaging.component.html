<div class="flex gap-4 items-end">

    <div *ngIf="chatService.state().selectedConversation?.id"
        class="w-80 h-[420px] bg-white rounded-t-xl shadow-2xl flex flex-col overflow-hidden">
        <app-chat class="flex flex-col h-full" />
    </div>

    <div class="w-80">
        <div class="p-3 border-b flex items-center justify-between rounded-t-lg bg-gray-200 cursor-pointer hover:bg-gray-300 transition"
            (click)="toggleConversations()">
            <span class="font-semibold">Messaging</span>

            <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="!isConversationOpen()"
                viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M6 9l6 6 6-6" />
            </svg>
        </div>

        <div *ngIf="isConversationOpen()"
            class="h-[420px] bg-white  shadow-2xl flex flex-col overflow-hidden">
            <app-conversations class="flex-1 overflow-y-auto" />
        </div>

    </div>

</div>
