<header class="max-w-8xl mx-auto sticky top-0 w-full bg-white border-b border-light-green/10 z-50 px-6 font-header">
    <div class="h-18 flex items-center justify-between">

        <div class="flex items-center gap-3">
            <img class="w-11 h-11 md:w-12 md:h-12" src="./assets/logo.png" alt="logo">
            <div class="relative hidden sm:block">
                <input type="search" placeholder="Search"
                    class="input rounded-3xl pl-10 md:w-80 focus:md:w-[500px] transition-all">
                <svg class="w-5 h-5 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
            </div>
        </div>

        <nav class="hidden lg:flex items-center gap-6 p-3">
            <a *ngFor="let item of navItems" [routerLink]="[item.link]" routerLinkActive="text-black"
                class="text-gray-500 hover:text-black transition-colors min-w-[64px] text-center">
                <svg class="w-8 h-8 mx-auto" viewBox="0 0 24 24" fill="currentColor">
                    <path [attr.d]="item.iconPath" />
                </svg>
                <span class="text-[11px] font-medium block">{{item.label}}</span>
            </a>

            <div class="relative border-l border-gray-300 pl-4 mx-3">
                <button (click)="toggleMe()"
                    class="flex flex-col justify-center items-center text-gray-500 hover:text-black transition-colors">
                    <img class="w-10 h-10 rounded-full border" src="./assets/our-team/micheal.jpeg" alt="user">
                    <span class="flex items-center text-[11px] font-medium mt-1">
                        Me <svg class="w-3 h-3 ml-0.5 transition-transform" [class.rotate-180]="isMeClicked"
                            fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 16L6 10H18L12 16Z" />
                        </svg>
                    </span>
                </button>

                <div *ngIf="isMeClicked"
                    class="absolute right-0 mt-2 w-48 bg-white border rounded-lg shadow-xl py-2 animate-in fade-in slide-in-from-top-2">
                    <a routerLink="/profile" class="block px-4 py-2 text-sm hover:bg-gray-100">View Profile</a>
                    <hr class="my-1">
                    <button class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Logout</button>
                </div>
            </div>
        </nav>

        <button (click)="isMenuOpen = !isMenuOpen" class="lg:hidden p-2">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path *ngIf="!isMenuOpen" d="M4 6h16M4 12h16m-7 6h7" stroke-width="2" stroke-linecap="round" />
                <path *ngIf="isMenuOpen" d="M6 18L18 6M6 6l12 12" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>
    </div>

    <div *ngIf="isMenuOpen" class="lg:hidden fixed inset-0 z-[60]">
        <div class="absolute inset-0 bg-black/20 backdrop-blur-sm" (click)="isMenuOpen = false"></div>

        <div class="absolute right-0 top-0 h-full w-64 bg-white shadow-2xl p-6 flex flex-col gap-6">
            <a *ngFor="let item of navItems" [routerLink]="[item.link]" (click)="isMenuOpen = false"
                class="flex items-center gap-4 text-gray-600">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                    <path [attr.d]="item.iconPath" />
                </svg>
                <span class="font-medium">{{item.label}}</span>
            </a>
            <hr>
            <a routerLink="/profile" (click)="isMenuOpen = false" class="font-medium text-gray-600">View Profile</a>
            <button class="text-left font-medium text-red-600">Logout</button>
        </div>
    </div>
</header>
