<main class="bg-white ">
    <div class="max-w-7xl mx-auto px-6 py-16 md:py-24">
        <div class="text-center max-w-3xl mx-auto mb-20">
            <span
                class="inline-block px-4 py-1.5 rounded-full bg-light-green/10 text-light-green text-xs font-bold uppercase tracking-widest mb-6">
                The Architects
            </span>
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-dark-blue mb-6 leading-tight">
                The Minds Behind <span class="text-light-green">the Mission</span>
            </h1>
            <p class="text-lg text-dark-blue/60 leading-relaxed">
                We are a group of developers and visionaries dedicated to bridging the gap between
                technology and human need. Our team built this smart ecosystem to redefine
                transparency in giving.
            </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div *ngFor="let member of teamMembers"
                class="group relative p-8 rounded-2xl bg-[#F6F8F7] transition-all duration-500 hover:-translate-y-2 overflow-hidden flex flex-col items-center text-center shadow-sm hover:shadow-2xl">

                <div
                    class="absolute inset-0 bg-gradient-to-br from-transparent via-transparent to-light-green/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                </div>

                <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-bright-blue to-light-green">
                </div>

                <span class="absolute top-4 right-4 z-20">
                    <svg class="w-6 h-6 text-light-green group-hover:scale-110 transition-transform duration-300"
                        fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 116.364 6.364L12 21.682 4.318 12.682a4.5 4.5 0 010-6.364z" />
                    </svg>
                </span>

                <div class="relative mb-6">
                    <div
                        class="absolute inset-0 bg-light-green rounded-full blur-xl opacity-0 group-hover:opacity-40 transition-opacity duration-500">
                    </div>
                    <div
                        class="relative w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-light-green to-bright-blue shadow-lg">
                        <div class="w-full h-full rounded-full overflow-hidden border-2 border-white bg-white">
                            <img [src]="member.image" [alt]="member.name" class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>

                <h3 class="text-dark-blue text-xl font-extrabold mb-1 z-10">{{member.name}}</h3>
                <p class="text-bright-blue font-bold text-[10px] mb-4 uppercase tracking-[0.2em] z-10">
                    {{member.role}}
                </p>

                <div class="w-12 h-1 bg-light-green mb-4 rounded-full transition-all duration-500 group-hover:w-24">
                </div>

                <p class="text-dark-blue/70 text-sm leading-relaxed z-10">
                    {{member.bio}}
                </p>

                <div
                    class="absolute -bottom-6 -right-6 w-24 h-24 bg-light-green/5 rounded-full group-hover:scale-150 transition-transform duration-700">
                </div>
            </div>
        </div>
    </div>
</main>
