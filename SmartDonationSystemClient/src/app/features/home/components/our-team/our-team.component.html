<main class="bg-white mx-auto px-6 py-16 md:py-24">
    <!-- Hero Section -->
    <div class="text-center max-w-3xl mx-auto mb-20">
        <span
            class="inline-block px-4 py-1.5 rounded-full bg-light-green/10 text-light-green text-xs font-bold uppercase tracking-widest mb-6">Our
            Team</span>
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-navy-brand dark:text-white mb-6 leading-tight">
            The Hearts Behind <span class="text-[var(--light-green)]">the Help</span>
        </h1>
        <p class="text-lg text-gray-600 dark:text-gray-400 leading-relaxed">
            Meet the innovators, dreamers, and philanthropists building the future of smart giving. We're on a mission
            to make every donation count.
        </p>
    </div>
    <!-- Team -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <div *ngFor="let member of teamMembers"
            class="group relative p-8 rounded-2xl bg-[#F6F8F7] transition-all duration-500 hover:-translate-y-2 overflow-hidden flex flex-col items-center text-center shadow-sm hover:shadow-2xl">

            <div
                class="absolute inset-0 bg-gradient-to-br from-transparent via-transparent to-[#42e2b8]/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
            </div>

            <div
                class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-[var(--bright-blue)] to-[var(--light-green)]">
            </div>

            <span class="absolute top-4 right-4 material-icons text-[var(--soft-red)] text-xl">
                <svg class="w-8 h-8 text-[var(--light-green)] animate-stepPulse" fill="none" fill="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 116.364 6.364L12 21.682 4.318 12.682a4.5 4.5 0 010-6.364z" />
                </svg>
            </span>

            <div class="relative mb-6">
                <div
                    class="absolute inset-0 bg-[var(--light-green)] rounded-full blur-xl opacity-0 group-hover:opacity-50 transition-opacity duration-500">
                </div>

                <div
                    class="relative w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-[var(--light-green)] to-[var(--bright-blue)] shadow-lg">
                    <div class="w-full h-full rounded-full overflow-hidden border-2 border-white">
                        <img [src]="member.image" [alt]="member.name" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>

            <h3 class="text-[var(--dark-blue)] text-xl font-extrabold mb-1 z-10">{{member.name}}</h3>
            <p class="text-[var(--bright-blue)] font-bold text-[10px] mb-4 uppercase tracking-[0.2em] z-10">
                {{member.role}}</p>

            <div
                class="w-12 h-1 bg-[var(--light-green)] mb-4 rounded-full transition-all duration-500 group-hover:w-24">
            </div>

            <p class="text-gray-600 text-sm leading-relaxed z-10">
                {{member.bio}}
            </p>

            <div
                class="absolute -bottom-6 -right-6 w-24 h-24 bg-[#42e2b8]/5 rounded-full group-hover:scale-150 transition-transform duration-700">
            </div>
        </div>
    </div>
</main>
