<div *ngIf="isOpen" (click)="onClose()" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">

    <div (click)="$event.stopPropagation()" class="bg-white dark:bg-slate-900 rounded-xl p-6 w-full max-w-md shadow-lg">

        <h2 class="text-lg font-bold mb-4">Add Category</h2>

        <div class="flex flex-col gap-4">
            <input type="text" placeholder="Title" [(ngModel)]="category.categoryName"
                class="border rounded-lg p-2 dark:bg-slate-800" />

            <textarea placeholder="Description" [(ngModel)]="category.description"
                class="border rounded-lg p-2 dark:bg-slate-800">
      </textarea>
        </div>

        <div class="flex justify-end gap-2 mt-6">
            <button (click)="onClose()" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-slate-700">
                Cancel
            </button>

            <button (click)="onSubmit()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white">
                Add
            </button>
        </div>

    </div>
</div>
