<div class="card-wrapper group relative bg-white rounded-3xl p-4 sm:p-5 shadow-sm hover:shadow-2xl transition-all duration-500 cursor-pointer border border-gray-100 hover:border-bright-blue/20 overflow-hidden"
    (click)="goToDetails()">

    <!-- Priority Tag -->
    <div class="absolute top-3 right-3 sm:top-4 sm:right-4 z-10">
        <span
            class="px-2 py-1 sm:px-3 sm:py-1.5 rounded-xl text-[10px] sm:text-xs font-bold tracking-wider uppercase shadow-sm"
            [ngClass]="post().priorityLevel | priorityClass">
            {{post().priorityLevel | priorityLabel}}
        </span>
    </div>

    <!-- Header: User Info -->
    <div class="flex items-start justify-between mb-4 sm:mb-6">
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="relative shrink-0">
                <img class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl object-cover ring-2 ring-gray-50 group-hover:ring-bright-blue/20 transition-all"
                    [src]="post().pictureUrl || './assets/avatar.png'" alt="requester">
                <div class="absolute -bottom-1.5 -right-1 sm:-bottom-2 sm:-right-1 ">
                    <mat-icon
                        class="!text-[14px] sm:!text-[16px] !w-3.5 !h-3.5 sm:!w-4 sm:!h-4 bg-white rounded-full text-light-green flex items-center justify-center">verified</mat-icon>
                </div>
            </div>
            <div class="flex flex-col min-w-0">
                <a [routerLink]="['/profile', post().userId]" (click)="$event.stopPropagation()"
                    class="text-sm sm:text-base font-bold text-dark-blue hover:text-bright-blue transition-colors truncate">
                    {{post().fullName}}
                </a>
                <div class="flex items-center gap-1.5 sm:gap-2 text-[10px] sm:text-xs font-medium mt-0.5">
                    <span class="text-gray-400 whitespace-nowrap">{{post().createdAt | timeAgo}}</span>
                    <span class="w-1 h-1 bg-gray-300 rounded-full shrink-0"></span>
                    <span class="text-bright-blue/80 truncate">{{post().categoryName}}</span>
                    <span class="w-1 h-1 bg-gray-300 rounded-full shrink-0"></span>
                    <div class="flex items-center gap-1 text-gray-400 shrink-0">
                        <mat-icon
                            class="!text-[14px] sm:!text-[16px] !h-[14px] sm:!h-[16px] !w-[14px] sm:!w-[16px] opacity-60">visibility</mat-icon>
                        <span>{{ post().viewCount | shortNumber }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Section -->
    <div class="relative rounded-2xl mb-4 sm:mb-5 overflow-hidden group-hover:shadow-inner transition-all shrink-0"
        *ngIf="post().postPicture">
        <img class="w-full aspect-[16/10] object-cover transition-transform duration-700 group-hover:scale-105"
            [src]="post().postPicture" alt="Post picture" />
        <div
            class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
        </div>
    </div>

    <!-- Content Section -->
    <div class="space-y-2 sm:space-y-3 mb-6 sm:mb-8 px-1">
        <h2
            class="text-lg sm:text-xl font-header font-bold text-dark-blue leading-tight group-hover:text-bright-blue transition-colors line-clamp-1">
            {{post().title}}
        </h2>
        <p class="text-xs sm:text-sm text-gray-500 font-content leading-relaxed line-clamp-3">
            {{post().content}}
        </p>
    </div>

    <!-- Actions Section -->
    <div class="flex flex-wrap items-center gap-2 sm:gap-3 mt-auto">
        <button
            *ngIf="post().userId !== authService.userData.id && post().createdByRole === 'Requester' && authService.isDonor()"
            (click)="$event.stopPropagation(); onLike(post())"
            class="flex-1 min-w-[120px] sm:min-w-[140px] flex items-center justify-center gap-1.5 sm:gap-2 bg-bright-blue hover:bg-dark-blue text-white font-bold text-xs sm:text-sm py-3 sm:py-3.5 rounded-2xl shadow-lg shadow-bright-blue/20 hover:shadow-dark-blue/20 active:scale-95 transition-all duration-300">
            <mat-icon class="!text-lg sm:!text-xl">volunteer_activism</mat-icon>
            Donate Now
        </button>

        <!-- Secondary: Message -->
        <button *ngIf="authService.isDonor() && post().userId !== authService.userData.id"
            (click)="chatService.openConversation(post().userId); $event.stopPropagation()"
            class="flex items-center justify-center gap-1 p-3 sm:p-3.5 bg-gray-50 text-dark-blue rounded-2xl hover:bg-bright-blue/10 hover:text-bright-blue transition-all duration-300 border border-transparent hover:border-bright-blue/10"
            title="Message author">
            <mat-icon class="!text-lg sm:!text-xl">chat_bubble_outline</mat-icon>
        </button>

        <button *ngIf="!authService.isDonor() && post().userId !== authService.userData.id"
            (click)="$event.stopPropagation();chatService.openConversation(post().userId)"
            class="flex-1 min-w-[120px] sm:min-w-[140px] flex items-center justify-center gap-1.5 sm:gap-2 bg-bright-blue hover:bg-dark-blue text-white font-bold text-xs sm:text-sm py-3 sm:py-3.5 rounded-2xl shadow-lg shadow-bright-blue/20 hover:shadow-dark-blue/20 active:scale-95 transition-all duration-300">
            <mat-icon class="!text-lg sm:!text-xl">chat_bubble_outline</mat-icon>
            Contact Donor
        </button>

        <!-- Interaction: Like -->
        <button (click)="onLike(post()); $event.stopPropagation()"
            class="flex items-center gap-1.5 sm:gap-2 px-4 sm:px-5 py-3 sm:py-3.5 font-bold rounded-2xl transition-all duration-300 border"
            [ngClass]="post().hasReacted 
                ? 'bg-soft-red text-white border-soft-red shadow-lg shadow-soft-red/20' 
                : 'bg-white text-soft-red border-soft-red/20 hover:bg-soft-red/5'" [disabled]="post().isReacting">
            <mat-icon class="transition-transform" [ngClass]="{'scale-125 active-heart': post().hasReacted}">
                {{ post().hasReacted ? 'favorite' : 'favorite_border' }}
            </mat-icon>
            <span class="text-xs sm:text-sm">{{post().likesCount}}</span>
        </button>
    </div>

</div>
