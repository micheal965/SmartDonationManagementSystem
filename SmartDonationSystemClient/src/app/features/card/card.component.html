<div class="card-wrapper group relative bg-white rounded-3xl p-5 shadow-sm hover:shadow-2xl transition-all duration-500 cursor-pointer border border-gray-100 hover:border-bright-blue/20 overflow-hidden"
    (click)="goToDetails()">

    <!-- Priority Tag -->
    <div class="absolute top-4 right-4 z-10">
        <span class="px-3 py-1.5 rounded-xl text-xs font-bold tracking-wider uppercase shadow-sm"
            [ngClass]="post().priorityLevel | priorityClass">
            {{post().priorityLevel | priorityLabel}}
        </span>
    </div>

    <!-- Header: User Info -->
    <div class="flex items-start justify-between mb-6">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img class="w-12 h-12 rounded-2xl object-cover ring-2 ring-gray-50 group-hover:ring-bright-blue/20 transition-all" 
                     [src]="post().pictureUrl || './assets/avatar.png'" alt="requester">
                <div class="absolute -bottom-1 -right-1 bg-white rounded-full p-0.5 shadow-sm">
                    <mat-icon class="!text-[16px] !w-4 !h-4 text-light-green flex items-center justify-center">verified</mat-icon>
                </div>
            </div>
            <div class="flex flex-col">
                <a [routerLink]="['/profile', post().userId]" (click)="$event.stopPropagation()"
                    class="text-base font-bold text-dark-blue hover:text-bright-blue transition-colors">
                    {{post().fullName}}
                </a>
                <div class="flex items-center gap-2 text-xs font-medium mt-0.5">
                    <span class="text-gray-400">{{post().createdAt | timeAgo}}</span>
                    <span class="w-1 h-1 bg-gray-300 rounded-full"></span>
                    <span class="text-bright-blue/80">{{post().categoryName}}</span>
                    <span class="w-1 h-1 bg-gray-300 rounded-full"></span>
                    <div class="flex items-center gap-1 text-gray-400">
                        <mat-icon class="!text-[16px] !h-[16px] !w-[16px] opacity-60">visibility</mat-icon>
                        <span>{{ post().viewCount | shortNumber }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Section -->
    <div class="relative rounded-2xl mb-5 overflow-hidden group-hover:shadow-inner transition-all" *ngIf="post().postPicture">
        <img class="w-full aspect-[16/10] object-cover transition-transform duration-700 group-hover:scale-105" 
             [src]="post().postPicture" alt="Post picture" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
    </div>

    <!-- Content Section -->
    <div class="space-y-3 mb-8 px-1">
        <h2 class="text-xl font-header font-bold text-dark-blue leading-tight group-hover:text-bright-blue transition-colors line-clamp-1">
            {{post().title}}
        </h2>
        <p class="text-gray-500 font-content text-sm leading-relaxed line-clamp-3">
            {{post().content}}
        </p>
    </div>

    <!-- Actions Section -->
    <div class="flex flex-wrap items-center gap-3">
        <!-- Main Action: Donate -->
        <button (click)="$event.stopPropagation()"
            class="flex-1 min-w-[140px] flex items-center justify-center gap-2 bg-bright-blue hover:bg-dark-blue text-white font-bold text-sm py-3.5 rounded-2xl shadow-lg shadow-bright-blue/20 hover:shadow-dark-blue/20 active:scale-95 transition-all duration-300">
            <mat-icon>volunteer_activism</mat-icon>
            Donate Now
        </button>

        <!-- Secondary: Message -->
        <button (click)="chatService.openConversation(post().userId); $event.stopPropagation()"
            class="p-3.5 bg-gray-50 text-dark-blue rounded-2xl hover:bg-bright-blue/10 hover:text-bright-blue transition-all duration-300 border border-transparent hover:border-bright-blue/10"
            title="Message requester">
            <mat-icon class="!flex !items-center !justify-center">chat_bubble_outline</mat-icon>
        </button>

        <!-- Interaction: Like -->
        <button (click)="onLike(post()); $event.stopPropagation()"
            class="flex items-center gap-2 px-5 py-3.5 font-bold rounded-2xl transition-all duration-300 border"
            [ngClass]="post().hasReacted 
                ? 'bg-soft-red text-white border-soft-red shadow-lg shadow-soft-red/20' 
                : 'bg-white text-soft-red border-soft-red/20 hover:bg-soft-red/5'"
            [disabled]="post().isReacting">
            <mat-icon class="transition-transform" 
                      [ngClass]="{'scale-125 active-heart': post().hasReacted}">
                {{ post().hasReacted ? 'favorite' : 'favorite_border' }}
            </mat-icon>
            <span class="text-sm">{{post().likesCount}}</span>
        </button>
    </div>
</div>
