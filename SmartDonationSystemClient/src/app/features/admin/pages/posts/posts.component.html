<main class="flex flex-col ml-64 p-10 bg-white rounded-3xl">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
        <div class="flex flex-col">
            <h2 class="text-3xl font-black text-slate-900 dark:text-slate-100 tracking-tight">Blog Posts</h2>
            <p class="text-slate-500 dark:text-slate-400 mt-1">Manage, edit and publish your content across all
                platforms.</p>
        </div>
    </div>
    <div class="flex gap-1 mb-8 overflow-x-auto pb-2 scrollbar-hide">
        <button *ngFor="let filter of filters" (click)="onFilter(filter.value)"
            class="px-6 py-2 rounded-full text-sm font-semibold whitespace-nowrap" [ngClass]="{
                'bg-indigo-600 text-white': filter.value===selectedFilter
             }">{{filter.label}}</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div *ngFor="let post of PaginatedPosts?.items"
            class="bg-white shadow-md rounded-xl overflow-hidden group hover:border-indigo-600/40 transition-all duration-300 hover:shadow-md">

            <!-- Image -->
            <div class="relative aspect-video overflow-hidden">
                <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                    [src]="post.postPicture" />
                <div class="absolute top-3 left-3 px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider backdrop-blur-md "
                    [ngClass]="getStatusClass(post.status)">
                    {{ post.status || 'Unknown' }}
                </div>
            </div>

            <!-- Content -->
            <div class="p-5 flex flex-col gap-4">

                <div>
                    <h3
                        class="text-slate-900 font-bold text-lg leading-tight line-clamp-2 group-hover:text-indigo-600 transition-colors">
                        {{ post.title }}
                    </h3>
                    <p class="text-slate-500 text-sm line-clamp-3">
                        {{ post.content }}
                    </p>
                    <p class="text-slate-500 text-xs mt-2 flex items-center gap-1">
                        <mat-icon class="text-sm">calendar_today</mat-icon>
                        {{ post.createdAt | date:'mediumDate' }}
                    </p>
                </div>

                <!-- Footer -->
                <div class="flex items-center justify-between border-t border-slate-100 pt-4">

                    <!-- Author -->
                    <div class="flex items-center gap-2">
                        <div class="w-6 h-6 rounded-full bg-slate-200 overflow-hidden">
                            <img class="w-full h-full rounded-full object-cover"
                                [src]="post.requesterPicture || 'assets/user.png'" />
                        </div>

                        <span class="text-xs text-slate-600 font-medium">
                            {{ post.requesterName || 'Unknown' }}
                        </span>
                    </div>

                    <!-- Actions -->
                    <button class="text-slate-400 hover:text-indigo-600 transition-colors">
                        <mat-icon>more_vert</mat-icon>
                    </button>

                </div>
            </div>
        </div>
    </div>
    <!-- Load More -->
    <div class="flex justify-center pt-12">
        <button (click)="onLoadMore()"
            class="px-8 py-3 bg-white hover:bg-gray-50 border border-slate-200 text-slate-900 rounded-full font-bold shadow-sm hover:border-indigo-600/30 transition-all flex items-center gap-2 text-sm active:scale-95">
            Load earlier notifications
        </button>
    </div>
</main>
