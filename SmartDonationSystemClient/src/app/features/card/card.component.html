<div class="relative bg-white shadow-sm rounded-3xl p-4 cursor-pointer" (click)="goToDetails()">
    <span
        class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center px-2 py-1 rounded-full text-xs z-10"
        [ngClass]="getPriorityClass(post().priorityLevel)">
        {{ getPriorityLabel( post().priorityLevel )}}
    </span>
    <div class="flex justify-between mb-8">
        <div class="flex items-center justify-center gap-2">
            <img class="w-8 h-8 rounded-full" [src]="post().pictureUrl ||'./assets/avatar.png'" alt="requester">
            <div class="flex flex-col">
                <span class="text-md text-dark-blue font-bold">{{post().fullName}}</span>
                <span class="text-xs text-gray-400">Posted {{post().createdAt | timeAgo}}</span>
            </div>
        </div>
        <div>
            <span class="flex items-center bg-light-green/15 text-dark-blue px-4 py-1 rounded-3xl ">
                <div class="w-5 h-5 flex items-center justify-center rounded-full ">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M10.5213 2.62368C11.3147 1.75253 12.6853 1.75253 13.4787 2.62368L14.4989 3.74391C14.8998 4.18398 15.4761 4.42283 16.0776 4.39808L17.6106 4.33501C18.8021 4.28598 19.714 5.19793 19.665 6.38939L19.6019 7.92243C19.5772 8.52387 19.816 9.10023 20.2561 9.5011L21.3763 10.5213C22.2475 11.3147 22.2475 12.6853 21.3763 13.4787L20.2561 14.4989C19.816 14.8998 19.5772 15.4761 19.6019 16.0776L19.665 17.6106C19.714 18.8021 18.8021 19.714 17.6106 19.665L16.0776 19.6019C15.4761 19.5772 14.8998 19.816 14.4989 20.2561L13.4787 21.3763C12.6853 22.2475 11.3147 22.2475 10.5213 21.3763L9.5011 20.2561C9.10023 19.816 8.52387 19.5772 7.92243 19.6019L6.38939 19.665C5.19793 19.714 4.28598 18.8021 4.33501 17.6106L4.39808 16.0776C4.42283 15.4761 4.18398 14.8998 3.74391 14.4989L2.62368 13.4787C1.75253 12.6853 1.75253 11.3147 2.62368 10.5213L3.74391 9.5011C4.18398 9.10023 4.42283 8.52387 4.39808 7.92243L4.33501 6.38939C4.28598 5.19793 5.19793 4.28598 6.38939 4.33501L7.92243 4.39808C8.52387 4.42283 9.10023 4.18398 9.5011 3.74391L10.5213 2.62368Z"
                            fill="#42e2b8" />
                        <path d="M9 12L11 14L15 10" stroke="white" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <span class="text-xs text-light-green">Verified</span>
            </span>
        </div>
    </div>
    <div class="rounded-lg mb-5">
        <iframe class="w-full h-full border rounded-lg" [src]="getSafeUrl(post().attachments[0])">
        </iframe>
    </div>
    <h2 class="text-xl font-bold text-dark-blue mb-3">{{post().title}}</h2>
    <p class="text-slate-600 text-sm leading-relaxed mb-6">{{post().content.split(' ').slice(0,27).join(' ')}}</p>
    <!-- Buttons -->
    <div class="flex flex-wrap gap-3 items-center">
        <!-- Donate Now Button -->
        <button
            class="flex-1 flex items-center justify-center gap-2 bg-light-green font-bold text-dark-blue text-sm py-3 rounded-xl shadow-lg shadow-light-green/30 hover:shadow-light-green/40 active:scale-95 transition-all">
            <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M21 15.5V17.5C21 18.8807 19.8807 20 18.5 20H5.5C4.11929 20 3 18.8807 3 17.5V14.5C3 13.3954 3.89543 12.5 5 12.5H18C19.1046 12.5 20 13.3954 20 14.5L21 15.5Z"
                    fill="var(--dark-blue)" />
                <rect x="5" y="11" width="3" height="6" rx="1.5" fill="var(--dark-blue)" />

                <path
                    d="M17.5 4C15.8 4 14.5 5.5 14 6C13.5 5.5 12.2 4 10.5 4C8.5 4 7 5.5 7 7.5C7 11 14 14.5 14 14.5C14 14.5 21 11 21 7.5C21 5.5 19.5 4 17.5 4Z"
                    fill="var(--dark-blue)" stroke="white" stroke-width="1.5" />
            </svg>
            Donate Now
        </button>

        <!-- Message Button -->
        <button
            class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-3 font-bold text-dark-blue text-sm border-2 border-slate-100 rounded-xl hover:bg-gray-100 transition-all ">
            <mat-icon>message</mat-icon>
            Message
        </button>

        <!-- Like Button -->
        <button
            class="w-full sm:w-auto flex items-center justify-center gap-1 px-6 py-3 font-bold border-2 text-red-500 text-sm border-red-100 rounded-xl hover:bg-red-100 hover:border-red-400/5 transition-all">
            <mat-icon>favorite</mat-icon>
            <span>1232</span>
        </button>
    </div>
</div>
