<aside class="w-64 bg-white border-r border-slate-100 hidden md:flex flex-col h-full fixed left-0 top-0 z-50">

    <div class="p-8 flex items-center justify-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center">
            <img [src]="user.pictureUrl || './assets/avatar.png'" alt="Admin picture"
                class="w-10 h-10 rounded-full object-cover ring-2 ring-gray-200">
        </div>
        <div class="flex flex-col">
            <h1 class="text-lg font-bold tracking-tight text-slate-900">{{user.fullName}}</h1>
            <p class="text-sm font-medium text-slate-500">{{user.role}}</p>
        </div>
    </div>

    <nav class="flex-1 px-6 space-y-2 mt-4">

        <!-- Dashboard -->
        <a [routerLink]="['dashboard']" routerLinkActive="bg-indigo-600 text-white shadow-xl shadow-indigo-100"
            class="flex items-center gap-4 px-4 py-3 rounded-3xl text-slate-500">
            <mat-icon>dashboard</mat-icon>
            <span class="text-sm font-semibold">Dashboard</span>
        </a>

        <!-- Notifications -->
        <a [routerLink]="['notifications']" routerLinkActive="bg-indigo-600 text-white shadow-xl shadow-indigo-100"
            class="flex items-center gap-4 px-4 py-3 rounded-3xl text-slate-500">
            <mat-icon>notifications</mat-icon>
            <span class="text-sm font-semibold">Notifications</span>
        </a>

        <!-- Users -->
        <a [routerLink]="['users']" routerLinkActive="bg-indigo-600 text-white shadow-xl shadow-indigo-100"
            class="flex items-center gap-4 px-4 py-3 rounded-3xl text-slate-500">
            <mat-icon>group</mat-icon>
            <span class="text-sm font-semibold">Users</span>
        </a>

        <!-- Posts -->
        <a [routerLink]="['posts']" routerLinkActive="bg-indigo-600 text-white shadow-xl shadow-indigo-100"
            class="flex items-center gap-4 px-4 py-3 rounded-3xl text-slate-500">
            <mat-icon>article</mat-icon>
            <span class="text-sm font-semibold">Posts</span>
        </a>

        <!-- Categories -->
        <a [routerLink]="['categories']" routerLinkActive="bg-indigo-600 text-white shadow-xl shadow-indigo-100"
            class="flex items-center gap-4 px-4 py-3 rounded-3xl text-slate-500">
            <mat-icon>category</mat-icon>
            <span class="text-sm font-semibold">Categories</span>
        </a>

        <!-- Analytics -->
        <a [routerLink]="['analytics']" routerLinkActive="bg-indigo-600 text-white shadow-xl shadow-indigo-100"
            class="flex items-center gap-4 px-4 py-3 rounded-3xl text-slate-500">
            <mat-icon>analytics</mat-icon>
            <span class="text-sm font-semibold">Analytics</span>
        </a>
    </nav>

    <!-- Logout & Return Home Buttons -->
    <div class="p-6 flex flex-col items-center justify-center gap-2">
        <!-- Logout Button -->
        <button (click)="logout()"
            class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl shadow-lg shadow-red-100 transition-all flex items-center justify-center gap-2">
            <mat-icon>logout</mat-icon>
            Logout
        </button>

        <!-- Return to Home Button -->
        <a [routerLink]="['/feed']"
            class="w-full py-2.5 bg-gray-200 hover:bg-gray-300 text-slate-900 text-xs font-bold rounded-xl text-center transition-all flex items-center justify-center gap-2">
            <mat-icon>home</mat-icon>
            Return to Home
        </a>
    </div>

</aside>
