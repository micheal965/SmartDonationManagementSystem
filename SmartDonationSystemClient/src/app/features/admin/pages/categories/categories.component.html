<main class="flex flex-col flex-1 lg:ml-64 p-4 sm:p-6 lg:p-10 bg-white rounded-3xl">

    <div class="flex-1 overflow-y-auto custom-scrollbar">
        <div class="flex flex-col gap-8">

            <!-- Header -->
            <div class="flex flex-col sm:flex-row flex-wrap items-end justify-between gap-4">

                <div>
                    <h2 class="text-3xl font-extrabold text-slate-900 dark:text-slate-100 tracking-tight">
                        Content Categories
                    </h2>
                    <p class="text-slate-500 dark:text-slate-400 mt-1">
                        Manage and organize your platform’s content structure.
                    </p>
                </div>

                <div class="px-6 py-3 rounded-xl border-l-4 border-l-indigo-600 bg-slate-50 shrink-0">
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-wider">
                        Active Categories
                    </p>
                    <p class="text-xl font-bold text-slate-900 dark:text-slate-100">
                        {{ categories.length }}
                    </p>
                </div>

            </div>

            <!-- Filter -->
            <div class="flex gap-2 p-1 w-fit rounded-xl">

                <button (click)="showAll()" [class.bg-indigo-600]="selectedFilter === 'all'"
                    [class.text-white]="selectedFilter === 'all'"
                    class="px-5 py-2 rounded-3xl text-sm font-medium transition">
                    All Categories
                </button>

                <button (click)="showPopular()" [ngClass]="{
            'bg-indigo-600 text-white': selectedFilter === 'popular'
          }" class="px-5 py-2 rounded-3xl text-sm font-medium transition">
                    Popular
                </button>

            </div>

            <!-- Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

                <!-- Category Card -->
                <div *ngFor="let cat of filteredCategories" class="relative group glass p-6 rounded-xl border border-black/5 dark:border-white/10
                 hover:border-indigo-600/50 hover:shadow-md transition-all">

                    <!-- Menu -->
                    <div class="absolute top-0 right-0 p-4 opacity-0 group-hover:opacity-100 transition-opacity">

                        <button (click)="toggleMenu()"
                            class="text-slate-400 hover:text-indigo-600 dark:hover:text-white">
                            <mat-icon>more_vert</mat-icon>
                        </button>

                        <!-- Dropdown -->
                        <div *ngIf="isMenuOpen"
                            class="absolute right-0 mt-2 w-32 bg-white dark:bg-slate-800 shadow-lg rounded-lg py-2 z-50">

                            <button (click)="onEdit(cat)"
                                class="w-full text-left px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700">
                                Edit
                            </button>

                        </div>

                    </div>

                    <!-- Icon -->
                    <div class="w-12 h-12 rounded-xl bg-indigo-600/10 dark:bg-indigo-600/20
                   text-indigo-600 flex items-center justify-center mb-4">
                        <mat-icon>{{getIcon(cat.name)}}</mat-icon>
                    </div>

                    <!-- Title -->
                    <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100 mb-2">
                        {{ cat.name }}
                    </h3>

                    <!-- Description -->
                    <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed mb-6 line-clamp-2">
                        {{ cat.description }}
                    </p>

                    <!-- Footer -->
                    <div class="flex items-center justify-between pt-4 border-t border-black/5 dark:border-white/5">

                        <span
                            class="bg-indigo-600/10 text-indigo-600 text-[10px] font-bold px-2 py-1 rounded-lg uppercase tracking-wider">
                            {{ cat.totalPosts }} Posts
                        </span>

                        <button (click)="deleteCategory(cat.id)" class="text-red-500 hover:text-white hover:bg-red-500 transition-all
                     text-xs font-semibold px-3 py-1 rounded-lg border border-red-500/30 hover:border-red-500">
                            Delete
                        </button>

                    </div>

                </div>

                <!-- Add Category -->
                <div (click)="openModal()" class="border-2 border-dashed border-black/10 dark:border-white/10
                 hover:border-indigo-600/50 hover:bg-indigo-600/5 transition-all
                 p-6 rounded-xl flex flex-col items-center justify-center gap-3 cursor-pointer group">

                    <div class="w-12 h-12 rounded-full bg-black/5 dark:bg-white/5 text-slate-400
                   group-hover:bg-indigo-600 group-hover:text-white transition-all
                   flex items-center justify-center">
                        <mat-icon>add</mat-icon>
                    </div>

                    <p class="text-sm font-semibold text-slate-500 dark:text-slate-400
                    group-hover:text-slate-900 dark:group-hover:text-slate-100 transition-colors">
                        Add Category
                    </p>

                </div>

            </div>
        </div>
    </div>

    <!-- Modals -->
    <app-create-category-modal [isOpen]="isCreateOpen" (close)="closeModal()" (submitForm)="onAddCategory($event)">
    </app-create-category-modal>

    <app-update-category-modal [isOpen]="isEditOpen" [formData]="selectedItemToUpdate" (closeModal)="isEditOpen = false"
        (update)="onUpdate($event)">
    </app-update-category-modal>

</main>
