<main class="flex flex-col ml-64 p-10 bg-gradient-to-br from-white to-slate-50 min-h-screen">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
        <div class="flex flex-col">
            <h2 class="text-3xl font-black text-slate-900 dark:text-slate-100 tracking-tight">Blog Posts</h2>
            <p class="text-slate-500 dark:text-slate-400 mt-1">Manage, edit and publish your content across all
                platforms.</p>
        </div>
        <button
            class="bg-indigo-600 hover:bg-indigo-600/90 text-white font-bold py-3 px-6 rounded-xl flex items-center gap-2 shadow-xl shadow-indigo-600/25 transition-all">
            <mat-icon>add</mat-icon>
            Create New Post
        </button>
    </div>
    <div class="flex gap-1 mb-8 overflow-x-auto pb-2 scrollbar-hide">
        <button class="px-6 py-2 rounded-full bg-indigo-600 text-white text-sm font-semibold whitespace-nowrap">All
            Posts</button>
        <button
            class="px-6 py-2 rounded-full glass-panel text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-slate-100 text-sm font-semibold whitespace-nowrap">Published</button>
        <button
            class="px-6 py-2 rounded-full glass-panel text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-slate-100 text-sm font-semibold whitespace-nowrap">Drafts</button>
        <button
            class="px-6 py-2 rounded-full glass-panel text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-slate-100 text-sm font-semibold whitespace-nowrap">Scheduled</button>
        <button
            class="px-6 py-2 rounded-full glass-panel text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-slate-100 text-sm font-semibold whitespace-nowrap">Archived</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Post Card 1 -->
        <div
            class="glass-panel rounded-xl overflow-hidden group hover:border-indigo-600/40 transition-all duration-300 shadow-sm hover:shadow-md">
            <div class="relative aspect-video overflow-hidden">
                <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                    data-alt="Abstract neural network representation"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNtuIH0_UFQM3tBI-oYt9cQjOgM5bN6_i5_FbSGSw8wqUle9nxPDpp9bady5ynV54NT2MUJR_C0x9ZfDq7Prg4ZCM8sUT3ZR7PyeZnK-kMuHSi6QgXbm2LJfjwyYtqBxAdVDjdCWZHa9er8MPIiZTiVqJ5H5yJkNqEwcF70lAv8ewS1Wv2O03FYlqzn4lsXy8SDFtycFKNW6PyRDYFRC6bZC6fUHgYbwMGs1zrWiS44CiHkRIQEA9aOgLvpBENHg_5sc6R_ubUDt8" />
                <div
                    class="absolute top-3 left-3 px-2 py-1 rounded bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-[10px] font-bold uppercase tracking-wider backdrop-blur-md border border-emerald-500/20">
                    Published
                </div>
            </div>
            <div class="p-5 flex flex-col gap-4">
                <div>
                    <h3
                        class="text-slate-900 dark:text-slate-100 font-bold text-lg leading-tight line-clamp-2 group-hover:text-indigo-600 transition-colors">
                        The Future of Generative AI in Creative Workflows</h3>
                    <p class="text-slate-500 dark:text-slate-500 text-xs mt-2 flex items-center gap-1">
                        <mat-icon class="text-sm">calendar_today</mat-icon>
                        Oct 12, 2023
                    </p>
                </div>
                <div class="flex items-center justify-between border-t border-slate-100 dark:border-white/5 pt-4">
                    <div class="flex items-center gap-2">
                        <div class="size-6 rounded-full bg-slate-200">
                            <img class="w-full h-full rounded-full" data-alt="Author Alex Doe"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuAfwC62vPAPhE9uRedjSmm5NIM3zLZ0Iop1R_LFVh8JsU857K-gD_5APJ1hWmQX9ECFxbYjDdWp23GlSMZOLdD2r6ed0k4YeIksOSk7JrRV8WppaxhGB2okhSp5yRiiHnVfaWn4NSUun6j_3-SlY5Om6TKy3LsE2kmtNHlPDlWXIL7GcjZyKxgzATHJvaqCeY7IfaNsSLQkfwl1uHCtgMTnLHm-vT1D2iXsrBJOqXngNhwv9Noj1a7KGUMldc-tjebLGZiJfyErKw" />
                        </div>
                        <span class="text-xs text-slate-600 dark:text-slate-300 font-medium">Alex Doe</span>
                    </div>
                    <button class="text-slate-400 hover:text-indigo-600 transition-colors">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                </div>
            </div>
        </div>


        <!-- Create Template Placeholder -->
        <div
            class="glass-panel rounded-xl flex items-center justify-center border-dashed border-2 border-slate-200 dark:border-white/10 group hover:border-indigo-600/40 transition-all cursor-pointer min-h-[320px]">
            <div class="flex flex-col items-center gap-3">
                <div
                    class="size-12 rounded-full glass-panel flex items-center justify-center text-slate-400 group-hover:text-indigo-600 group-hover:bg-indigo-600/10 transition-all">
                    <mat-icon class="text-3xl">add</mat-icon>
                </div>
                <span
                    class="text-sm font-semibold text-slate-400 group-hover:text-indigo-600 dark:group-hover:text-slate-200">New
                    Post Template</span>
            </div>
        </div>
    </div>
</main>
