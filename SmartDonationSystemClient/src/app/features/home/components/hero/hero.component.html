<main
    class="relative min-h-screen pt-32 pb-20 bg-gradient-to-l from-white via-transparent to-light-green/15 shadow-light-green/15 overflow-hidden">
    <div class="max-w-7xl mx-auto px-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
            <!-- Left Content -->
            <div class="space-y-8 relative z-10">
                <div
                    class="inline-flex items-center gap-2 px-4 py-2 bg-light-green border border-light-green bg-light-green/10 rounded-full">
                    <span class="w-2 h-2 rounded-full bg-light-green"></span>
                    <span class="text-xs font-bold uppercase tracking-widest text-light-green">Smart Donation Platform
                        v1.0</span>
                </div>

                <h1 class="text-5xl lg:text-7xl font-800 text-dark-blue">
                    Giving Made <span class="text-light-green">Smarter</span> <br />
                    & More Transparent
                </h1>

                <p class="text-lg md:text-xl text-dark-blue max-w-xl">
                    The intelligent bridge between generous hearts and verified needs.
                    Our platform uses smart matching to connect your donations with
                    real-time cases, ensuring every contribution creates a verified impact.
                </p>

                <div class="flex flex-col sm:flex-row items-center gap-4 pt-4">
                    <button [routerLink]="['./feed']"
                        class="group w-full sm:w-auto px-8 py-4 bg-light-green text-white text-lg font-bold rounded-3xl shadow-xl shadow-light-green/20 hover:brightness-105 transition-all flex items-center justify-center gap-2 group">
                        Explore Cases
                        <svg class="w-6 h-6 group-hover:translate-x-1 duration-300" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                    <button [routerLink]="['/']" fragment="how-it-works"
                        class="w-full sm:w-auto px-8 py-4 bg-transparent border-2 border-bright-blue/20 text-lg font-bold rounded-3xl hover:bg-bright-blue/5 transition-all flex items-center justify-center gap-2">
                        How it Works
                    </button>
                </div>
            </div>
            <!-- Right Visual (Dashboard Mockup) -->
            <div class="relative">
                <div class="swiper mySwiper h-[480px] rounded-2xl overflow-hidden shadow-2xl">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide" *ngFor="let img of images">
                            <div class="relative">
                                <img [src]="img.url" class="w-full h-full object-cover" />
                                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                            </div>
                        </div>

                    </div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>
        </div>
    </div>
</main>
