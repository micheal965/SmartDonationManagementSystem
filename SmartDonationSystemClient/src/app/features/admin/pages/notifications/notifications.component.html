<main class="flex flex-col ml-64 p-10 bg-white rounded-3xl">
    <div class="mt-12 mx-64 space-y-8">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <h1 class="text-2xl md:text-3xl font-black tracking-tight text-slate-900">Notifications</h1>
                <p class="text-slate-500 mt-1">Manage your system activity and updates across the suite.</p>
            </div>
            <button (click)="notificationService.markAllAsRead()"
                class="px-5 py-2.5 bg-white border border-slate-200 text-gray-700 rounded-xl text-sm font-bold shadow-sm hover:border-indigo-600/30 hover:text-indigo-600 transition-all flex items-center gap-2 active:scale-95">
                <mat-icon class="text-[20px]">done_all</mat-icon>
                Mark all as read
            </button>
        </div>

        <div class=" w-fit py-2 text-sm font-bold  text-indigo-600 border-b-2 border-indigo-600">
            New Notifications ({{notificationService.unreadCount()}})
        </div>

        <!-- Notification List -->
        <div class="space-y-5 mx-4">
            <div (click)="goToDetails(n)" *ngFor="let n of notificationService.state()?.items"
                class="group relative shadow-md rounded-xl p-5 transition-all duration-300 hover:shadow-xl flex items-start gap-4 border-l-4 cursor-pointer"
                [ngClass]="[
                notificationStyle[n.type]?.border || 'border-slate-400',
                !n.isRead ? 'bg-slate-50':'bg-white'
            ]">

                <div class="w-12 h-12 rounded-full flex items-center justify-center">
                    <img class="rounded-full w-full h-full" [src]="n.actorImage || './assets/avatar.png'"
                        alt="Actor Image">
                </div>

                <div class="flex-1">
                    <div class="flex items-center gap-2">
                        <h4 class="font-bold text-slate-900">{{n.title}}</h4>
                        <div *ngIf="!n.isRead" class="w-2 h-2 rounded-full animate-pulse"
                            [ngClass]="notificationStyle[n.type]?.dot || 'bg-gray-400'">
                        </div>
                    </div>

                    <p class="text-sm text-slate-600 mt-1 leading-relaxed">{{ n.message }}</p>

                    <span
                        class="flex justify-between text-[11px] font-bold text-slate-400 mt-3  uppercase tracking-wider">
                        <span> {{ n.createdAt | date:'medium' }} </span>
                        <span>{{n.type}}</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Load More -->
        <div class="flex justify-center pt-6">
            <button (click)="LoadMoreNotifications()"
                class="px-8 py-3 bg-white border border-slate-200 text-slate-900 rounded-full font-bold shadow-sm hover:border-indigo-600/30 hover:bg-slate-100 transition-all flex items-center gap-2 text-sm active:scale-95">
                Load earlier notifications
            </button>
        </div>
    </div>
</main>
