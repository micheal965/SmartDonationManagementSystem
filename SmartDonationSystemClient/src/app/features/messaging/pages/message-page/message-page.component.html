<div
    class="flex flex-col h-[calc(100vh-8rem)] sm:h-[calc(100vh-10rem)] lg:h-[calc(100vh-12rem)] bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <!-- Mobile Header (Only visible when chat is open on mobile) -->
    <div *ngIf="chatService.state().selectedConversation && !isLargeScreen()"
        class="px-4 py-3 border-b flex items-center gap-3 bg-white sticky top-0 z-10">
        <button (click)="backToConversations()"
            class="p-2 hover:bg-gray-100 rounded-full transition-colors text-gray-600">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <div class="flex items-center gap-3">
            <img [src]="chatService.state().selectedConversation?.otherUserImage || 'assets/avatar.png'"
                class="w-10 h-10 rounded-full object-cover border border-gray-100" alt="user" />
            <div class="flex flex-col">
                <span class="font-bold text-dark-blue leading-tight">
                    {{ chatService.state().selectedConversation?.otherUserName }}
                </span>
                <span class="text-[10px] text-green-500 font-medium">Active now</span>
            </div>
        </div>
    </div>

    <!-- Desktop Header / Mobile Conversations Header -->
    <div *ngIf="!chatService.state().selectedConversation || isLargeScreen()"
        class="px-6 py-4 border-b flex items-center justify-between bg-white">
        <h1 class="text-xl font-extrabold text-dark-blue tracking-tight">
            {{ isLargeScreen() && chatService.state().selectedConversation ? 'Chat' : 'Messages' }}
        </h1>
        <button class="p-2 hover:bg-gray-100 rounded-full transition-colors text-gray-500 lg:hidden"
            *ngIf="!chatService.state().selectedConversation">
            <mat-icon>more_vert</mat-icon>
        </button>
    </div>

    <!-- Content Area -->
    <div class="flex-1 flex min-h-0 overflow-hidden">
        <!-- Conversations List -->
        <div class="w-full lg:w-80 border-r border-gray-100 flex flex-col bg-white transition-all duration-300"
            [class.hidden]="chatService.state().selectedConversation && !isLargeScreen()">
            <app-conversations class="flex-1 overflow-y-auto no-scrollbar" />
        </div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col bg-gray-50/30 relative"
            [class.hidden]="!chatService.state().selectedConversation && !isLargeScreen()">
            <ng-container *ngIf="chatService.state().selectedConversation; else selectPrompt">
                <app-chat class="flex-1 h-full" />
            </ng-container>

            <ng-template #selectPrompt>
                <div class="hidden lg:flex flex-col items-center justify-center h-full text-center p-8">
                    <div class="w-20 h-20 bg-light-green/10 rounded-full flex items-center justify-center mb-6">
                        <mat-icon class="!w-10 !h-10 !text-4xl text-light-green">forum</mat-icon>
                    </div>
                    <h2 class="text-xl font-bold text-dark-blue mb-2">Your Messages</h2>
                    <p class="text-gray-500 max-w-xs mx-auto">Select a conversation from the list to start chatting or
                        view history.</p>
                </div>
            </ng-template>
        </div>
    </div>
</div>
