<nav
    class="h-full w-full bg-gradient-to-bl from-dark-blue to-bright-blue text-white p-6 xl:p-8 flex flex-col shadow-2xl transition-all duration-300">

    <div class="pb-6 flex items-center gap-3 xl:gap-4 mb-6 xl:mb-8 border-b border-white/20">
        <div class="relative shrink-0">
            <img [src]="user?.pictureUrl || './assets/avatar.png'" alt="User picture"
                class="w-10 h-10 xl:w-12 xl:h-12 rounded-full object-cover ring-2 ring-white/20 shadow-lg">
            <span
                class="absolute bottom-0 right-0 w-2.5 h-2.5 xl:w-3 xl:h-3 bg-green-400 border-2 border-dark-blue rounded-full"></span>
        </div>

        <div class="flex flex-col min-w-0">
            <h1 class="text-sm xl:text-base font-bold text-white leading-tight truncate">
                {{user?.fullName || 'User Name'}}
            </h1>
            <span class="mt-1 inline-block w-fit px-2 py-0.5 xl:px-3 xl:py-1 text-[10px] font-bold rounded-full 
                   bg-white/10 text-light-green tracking-wider uppercase">
                {{user?.role || 'User'}}
            </span>
        </div>
    </div>

    <div class="space-y-1.5 flex-1 overflow-y-auto no-scrollbar">
        <a class="flex items-center gap-3 p-3 rounded-2xl hover:bg-white/10  transition-all duration-200 group"
            [routerLink]="['/feed']" [routerLinkActive]="['bg-light-green','text-dark-blue','shadow-lg']">
            <mat-icon class="group-hover:scale-110 transition-transform">home</mat-icon>
            <span class="font-semibold text-sm xl:text-base">Home</span>
        </a>
        <a class="flex items-center gap-3 p-3 rounded-2xl hover:bg-white/10 transition-all duration-200 group"
            [routerLink]="['/notifications']" [routerLinkActive]="['bg-light-green','text-dark-blue','shadow-lg']">
            <mat-icon class="group-hover:scale-110 transition-transform">notifications</mat-icon>
            <span class="font-semibold text-sm xl:text-base">Notifications</span>
        </a>
        <a class="flex items-center gap-3 p-3 rounded-2xl hover:bg-white/10 transition-all duration-200 group"
            [routerLink]="['/messaging']" [routerLinkActive]="['bg-light-green','text-dark-blue','shadow-lg']">
            <mat-icon class="group-hover:scale-110 transition-transform">message</mat-icon>
            <span class="font-semibold text-sm xl:text-base">Messages</span>
        </a>
        <a *ngIf="authService.isDonor()"
            class="flex items-center gap-3 p-3 rounded-2xl hover:bg-white/10  transition-all duration-200  group"
            [routerLink]="['/my-donations']" [routerLinkActive]="['bg-light-green','text-dark-blue','shadow-lg']">
            <mat-icon class="group-hover:scale-110 transition-transform">favorite</mat-icon>
            <span class="font-semibold text-sm xl:text-base">My Donations</span>
        </a>
        <a class="flex items-center gap-3 p-3 rounded-2xl hover:bg-white/10 transition-all duration-200  group"
            [routerLink]="['/categories']" [routerLinkActive]="['bg-light-green','text-dark-blue','shadow-lg']">
            <mat-icon class="group-hover:scale-110 transition-transform">grid_view</mat-icon>
            <span class="font-semibold text-sm xl:text-base">Categories</span>
        </a>
        <div *ngIf="authService.isAdmin()">

            <div class="pt-6 pb-2">
                <p class="text-[9px] xl:text-[10px] font-bold uppercase tracking-[0.2em] text-white/40 px-4">
                    Admin
                </p>
            </div>

            <a class="flex items-center gap-3 p-3 rounded-2xl transition-all duration-200 group
               hover:bg-white/10" [routerLink]="['/admin']" routerLinkActive="bg-light-green text-dark-blue shadow-lg">

                <mat-icon class="group-hover:scale-110 transition-transform ">
                    admin_panel_settings
                </mat-icon>

                <span class="font-semibold text-sm xl:text-base">
                    Dashboard
                </span>
            </a>

        </div>

        <div class="pt-6 pb-2">
            <p class="text-[9px] xl:text-[10px] font-bold uppercase tracking-[0.2em] text-white/40 px-4">
                Platform
            </p>
        </div>

        <a [routerLink]="['/']" [fragment]="'home'"
            class="flex items-center gap-3 p-3 rounded-2xl hover:bg-white/10 transition-all duration-200 group"
            routerLinkActive="bg-light-green text-dark-blue shadow-lg" [routerLinkActiveOptions]="{ exact: true }">
            <mat-icon class="group-hover:scale-110 transition-transform">groups</mat-icon>
            <span class="font-semibold text-sm xl:text-base">About Us</span>
        </a>

    </div>

    <div class="mt-auto bg-white/5 rounded-3xl p-4 border border-white/10 shadow-inner">
        <p class="text-xs text-white/60 mb-3 leading-relaxed font-medium">Ready to make a bigger difference?</p>
        <button
            class="w-full py-3 bg-light-green text-dark-blue font-bold rounded-xl text-sm hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg shadow-light-green/10">
            Start Fundraiser
        </button>
    </div>
</nav>
